services:
  # Postgres / Redis / worker / beat stay internal-only (no host ports).
  # Only frontend (:5173) and backend (:8000) are published.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
      DATABASE_URL_SYNC: postgresql+psycopg2://support:support@postgres:5432/support
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      KNOWLEDGE_UPLOAD_DIR: /tmp/support-knowledge
      STORAGE_ROOT_DIR: /tmp/support-attachments
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - knowledge_uploads:/tmp/support-knowledge
      - attachment_uploads:/tmp/support-attachments

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
      DATABASE_URL_SYNC: postgresql+psycopg2://support:support@postgres:5432/support
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      KNOWLEDGE_UPLOAD_DIR: /tmp/support-knowledge
      STORAGE_ROOT_DIR: /tmp/support-attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - knowledge_uploads:/tmp/support-knowledge
      - attachment_uploads:/tmp/support-attachments

  beat:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://support:support@postgres:5432/support
      DATABASE_URL_SYNC: postgresql+psycopg2://support:support@postgres:5432/support
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      # Baked in at image build time — set in .env.
      # Rebuild after changing: docker compose up --build frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000/ws}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  knowledge_uploads:
  attachment_uploads:
