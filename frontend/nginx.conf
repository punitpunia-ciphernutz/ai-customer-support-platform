server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /widget.js {
        add_header Cache-Control "public, max-age=300";
        try_files /widget.js =404;
    }

    location /widget-frame.html {
        try_files /widget-frame.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
